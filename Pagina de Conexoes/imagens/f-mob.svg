<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgFmob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c8d8cc"/>
      <stop offset="50%"  stop-color="#b4c8ba"/>
      <stop offset="100%" stop-color="#beccc4"/>
    </linearGradient>
    <linearGradient id="phoneFmob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a2e22"/>
      <stop offset="100%" stop-color="#0e1c14"/>
    </linearGradient>
    <linearGradient id="screenFmob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0f4f2"/>
      <stop offset="100%" stop-color="#e2ece6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgFmob)"/>

  <!-- Subtle grid -->
  <g opacity="0.07" stroke="#2a5a3a" stroke-width="0.5">
    <line x1="0"   y1="50"  x2="400" y2="50"/>
    <line x1="0"   y1="100" x2="400" y2="100"/>
    <line x1="0"   y1="150" x2="400" y2="150"/>
    <line x1="80"  y1="0"   x2="80"  y2="200"/>
    <line x1="160" y1="0"   x2="160" y2="200"/>
    <line x1="240" y1="0"   x2="240" y2="200"/>
    <line x1="320" y1="0"   x2="320" y2="200"/>
  </g>

  <!-- Smartphone body (centered-left) -->
  <rect x="140" y="20" width="72" height="160" rx="12" fill="url(#phoneFmob)" opacity="0.85" stroke="#3a5a42" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Notch -->
  <rect x="162" y="23"  width="28" height="5" rx="2.5" fill="#0e1c14" opacity="0.9"/>
  <!-- Screen -->
  <rect x="146" y="32"  width="60" height="134" rx="3" fill="url(#screenFmob)" opacity="0.9"/>

  <!-- WhatsApp top bar -->
  <rect x="146" y="32" width="60" height="18" rx="0" fill="#25D366" opacity="0.9"/>
  <circle cx="156" cy="41" r="5"   fill="#1aaa55" opacity="0.9"/>
  <rect x="165"   y="37" width="24" height="3" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="165"   y="43" width="16" height="2.5" rx="1" fill="rgba(255,255,255,0.6)"/>

  <!-- Chat bubbles -->
  <rect x="148" y="54"  width="34" height="13" rx="6"  fill="#e5e5e5" opacity="0.9"/>
  <rect x="150" y="58"  width="30" height="3"  rx="1.5" fill="#999" opacity="0.5"/>
  <rect x="150" y="63"  width="20" height="2.5" rx="1" fill="#999" opacity="0.3"/>

  <rect x="162" y="71"  width="38" height="13" rx="6"  fill="#dcf8c6" opacity="0.9"/>
  <rect x="164" y="75"  width="30" height="3"  rx="1.5" fill="#4a9a5a" opacity="0.4"/>
  <rect x="164" y="80"  width="22" height="2.5" rx="1" fill="#4a9a5a" opacity="0.25"/>

  <rect x="148" y="88"  width="40" height="16" rx="6"  fill="#e5e5e5" opacity="0.9"/>
  <rect x="150" y="92"  width="36" height="3"  rx="1.5" fill="#999" opacity="0.5"/>
  <rect x="150" y="97"  width="26" height="2.5" rx="1" fill="#999" opacity="0.3"/>
  <rect x="150" y="101" width="32" height="2.5" rx="1" fill="#999" opacity="0.25"/>

  <rect x="158" y="108" width="44" height="13" rx="6"  fill="#dcf8c6" opacity="0.9"/>
  <rect x="160" y="112" width="40" height="3"  rx="1.5" fill="#4a9a5a" opacity="0.4"/>
  <rect x="160" y="117" width="30" height="2.5" rx="1" fill="#4a9a5a" opacity="0.25"/>

  <!-- Input bar -->
  <rect x="146" y="126" width="60" height="12" fill="#f5f5f5" opacity="0.9"/>
  <rect x="149" y="129" width="42" height="6"  rx="3" fill="#e0e0e0" opacity="0.8"/>
  <circle cx="199" cy="132" r="4"  fill="#25D366" opacity="0.9"/>

  <!-- Home bar -->
  <rect x="162" y="142" width="28" height="3"  rx="1.5" fill="#2a4432" opacity="0.4"/>

  <!-- Left side: agent avatars -->
  <circle cx="40"  cy="60"  r="22" fill="#25D366" opacity="0.25"/>
  <text   x="40"  y="66"   font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.6" font-weight="bold">A</text>
  <circle cx="40"  cy="110" r="22" fill="#1d4ed8" opacity="0.22"/>
  <text   x="40"  y="116"  font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.6" font-weight="bold">B</text>
  <circle cx="40"  cy="158" r="20" fill="#7c3aed" opacity="0.20"/>
  <text   x="40"  y="164"  font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.55" font-weight="bold">C</text>
  <!-- Connection lines -->
  <line x1="62" y1="60"  x2="140" y2="41"  stroke="#3a7a4a" stroke-width="1" opacity="0.15"/>
  <line x1="62" y1="110" x2="140" y2="80"  stroke="#3a7a4a" stroke-width="1" opacity="0.15"/>
  <line x1="60" y1="158" x2="140" y2="120" stroke="#3a7a4a" stroke-width="1" opacity="0.12"/>

  <!-- Right side: Kanban mini -->
  <rect x="244" y="30"  width="40" height="140" rx="5" fill="#2a4a32" opacity="0.22"/>
  <rect x="248" y="34"  width="32" height="8"   rx="2" fill="#3a8a4a" opacity="0.3"/>
  <rect x="248" y="46"  width="32" height="10"  rx="2" fill="#4a9a5a" opacity="0.15"/>
  <rect x="248" y="59"  width="32" height="10"  rx="2" fill="#4a9a5a" opacity="0.12"/>
  <rect x="248" y="72"  width="32" height="10"  rx="2" fill="#4a9a5a" opacity="0.10"/>
  <text x="264" y="41"  font-family="Arial,sans-serif" font-size="4.5" fill="white" text-anchor="middle" opacity="0.4">AGUARDANDO</text>

  <rect x="292" y="30"  width="40" height="140" rx="5" fill="#2a4a32" opacity="0.22"/>
  <rect x="296" y="34"  width="32" height="8"   rx="2" fill="#f59e0b" opacity="0.25"/>
  <rect x="296" y="46"  width="32" height="10"  rx="2" fill="#4a9a5a" opacity="0.15"/>
  <rect x="296" y="59"  width="32" height="10"  rx="2" fill="#4a9a5a" opacity="0.12"/>
  <text x="312" y="41"  font-family="Arial,sans-serif" font-size="4.5" fill="white" text-anchor="middle" opacity="0.4">EM ATEND.</text>

  <rect x="340" y="30"  width="50" height="140" rx="5" fill="#2a4a32" opacity="0.22"/>
  <rect x="344" y="34"  width="42" height="8"   rx="2" fill="#3a8a4a" opacity="0.3"/>
  <rect x="344" y="46"  width="42" height="10"  rx="2" fill="#4a9a5a" opacity="0.15"/>
  <rect x="344" y="59"  width="42" height="10"  rx="2" fill="#4a9a5a" opacity="0.12"/>
  <rect x="344" y="72"  width="42" height="10"  rx="2" fill="#4a9a5a" opacity="0.10"/>
  <text x="365" y="41"  font-family="Arial,sans-serif" font-size="4.5" fill="white" text-anchor="middle" opacity="0.4">FINALIZADO</text>

  <!-- WhatsApp logo subtle background -->
  <circle cx="200" cy="100" r="80" fill="#25D366" opacity="0.04"/>

  <!-- Particles -->
  <circle cx="20"  cy="20"  r="3" fill="#2a6a3a" opacity="0.2"/>
  <circle cx="380" cy="30"  r="2" fill="#2a6a3a" opacity="0.15"/>
  <circle cx="370" cy="170" r="3" fill="#2a6a3a" opacity="0.18"/>
  <circle cx="15"  cy="175" r="2" fill="#2a6a3a" opacity="0.15"/>
</svg>
