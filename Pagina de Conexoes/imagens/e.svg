<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0dce8"/>
      <stop offset="50%" stop-color="#b8cad8"/>
      <stop offset="100%" stop-color="#c8d6e4"/>
    </linearGradient>
    <linearGradient id="monitorE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e55"/>
      <stop offset="100%" stop-color="#1a2636"/>
    </linearGradient>
    <linearGradient id="screenE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#e2eaf2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="720" fill="url(#bgE)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#3a5a7a" stroke-width="0.5">
    <line x1="0" y1="90" x2="200" y2="90"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
    <line x1="0" y1="270" x2="200" y2="270"/>
    <line x1="0" y1="360" x2="200" y2="360"/>
    <line x1="0" y1="450" x2="200" y2="450"/>
    <line x1="0" y1="540" x2="200" y2="540"/>
    <line x1="0" y1="630" x2="200" y2="630"/>
    <line x1="50" y1="0" x2="50" y2="720"/>
    <line x1="100" y1="0" x2="100" y2="720"/>
    <line x1="150" y1="0" x2="150" y2="720"/>
  </g>

  <!-- Monitor frame (desktop) -->
  <rect x="18" y="200" width="164" height="120" rx="6" fill="url(#monitorE)" opacity="0.85"/>
  <!-- Toolbar -->
  <rect x="18" y="200" width="164" height="22" rx="6" fill="#3d5268" opacity="0.9"/>
  <rect x="18" y="214" width="164" height="8" fill="#3d5268" opacity="0.9"/>
  <!-- Traffic lights -->
  <circle cx="30" cy="211" r="4.5" fill="#ef4444" opacity="0.9"/>
  <circle cx="42" cy="211" r="4.5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="54" cy="211" r="4.5" fill="#22c55e" opacity="0.9"/>
  <!-- URL bar -->
  <rect x="66" y="205" width="82" height="12" rx="6" fill="#253444" opacity="0.9"/>
  <rect x="74" y="209" width="10" height="4" rx="2" fill="#4a7a8a" opacity="0.5"/>
  <rect x="88" y="209" width="40" height="4" rx="2" fill="#4a7a8a" opacity="0.4"/>

  <!-- Website content inside monitor -->
  <!-- Header bar -->
  <rect x="22" y="224" width="156" height="14" fill="#3d5a7a" opacity="0.7"/>
  <rect x="26" y="228" width="30" height="6" rx="2" fill="#7aaac8" opacity="0.6"/>
  <rect x="110" y="228" width="16" height="6" rx="2" fill="#7aaac8" opacity="0.4"/>
  <rect x="130" y="228" width="16" height="6" rx="2" fill="#7aaac8" opacity="0.4"/>
  <rect x="150" y="228" width="16" height="6" rx="2" fill="#7aaac8" opacity="0.4"/>

  <!-- Hero area -->
  <rect x="22" y="240" width="156" height="38" fill="#2a3f55" opacity="0.6"/>
  <rect x="50" y="248" width="80" height="7" rx="2" fill="#9ac0d8" opacity="0.7"/>
  <rect x="60" y="259" width="60" height="5" rx="2" fill="#7aaac8" opacity="0.5"/>
  <rect x="68" y="267" width="24" height="8" rx="4" fill="#6aaa8a" opacity="0.7"/>

  <!-- Cards row -->
  <rect x="22" y="282" width="46" height="30" rx="3" fill="#3a5068" opacity="0.6"/>
  <rect x="74" y="282" width="46" height="30" rx="3" fill="#3a5068" opacity="0.6"/>
  <rect x="126" y="282" width="50" height="30" rx="3" fill="#3a5068" opacity="0.6"/>
  <rect x="30" y="288" width="30" height="4" rx="1" fill="#9ac0d8" opacity="0.5"/>
  <rect x="30" y="295" width="22" height="3" rx="1" fill="#7aaac8" opacity="0.3"/>
  <rect x="82" y="288" width="30" height="4" rx="1" fill="#9ac0d8" opacity="0.5"/>
  <rect x="82" y="295" width="22" height="3" rx="1" fill="#7aaac8" opacity="0.3"/>
  <rect x="134" y="288" width="30" height="4" rx="1" fill="#9ac0d8" opacity="0.5"/>
  <rect x="134" y="295" width="22" height="3" rx="1" fill="#7aaac8" opacity="0.3"/>

  <!-- Monitor stand -->
  <rect x="90" y="321" width="20" height="22" fill="#2a3f55" opacity="0.7"/>
  <rect x="74" y="342" width="52" height="7" rx="3" fill="#3a5068" opacity="0.6"/>

  <!-- Floating phone (mobile preview) -->
  <rect x="130" y="380" width="42" height="72" rx="8" fill="#2a3f55" opacity="0.75" stroke="#4a7a9a" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="135" y="392" width="32" height="50" rx="3" fill="#3a5470" opacity="0.7"/>
  <!-- Phone screen content -->
  <rect x="137" y="396" width="28" height="8" fill="#4a7aaa" opacity="0.5"/>
  <rect x="137" y="407" width="20" height="3" rx="1" fill="#8ab8d8" opacity="0.4"/>
  <rect x="137" y="413" width="24" height="3" rx="1" fill="#8ab8d8" opacity="0.35"/>
  <rect x="137" y="419" width="16" height="6" rx="3" fill="#5a9a7a" opacity="0.5"/>
  <!-- Notch -->
  <rect x="145" y="383" width="14" height="4" rx="2" fill="#1e2e3f" opacity="0.8"/>

  <!-- Floating code elements -->
  <text x="8" y="100" font-family="monospace" font-size="48" fill="#3a5a7a" opacity="0.12">&lt;</text>
  <text x="140" y="170" font-family="monospace" font-size="48" fill="#3a5a7a" opacity="0.12">&gt;</text>
  <text x="10" y="480" font-family="monospace" font-size="44" fill="#3a5a7a" opacity="0.10">{</text>
  <text x="145" y="560" font-family="monospace" font-size="44" fill="#3a5a7a" opacity="0.10">}</text>
  <text x="55" y="640" font-family="monospace" font-size="30" fill="#3a5a7a" opacity="0.08">&lt;/&gt;</text>

  <!-- Code lines floating -->
  <rect x="14" y="510" width="50" height="4" rx="2" fill="#5a7a9a" opacity="0.15"/>
  <rect x="14" y="518" width="38" height="4" rx="2" fill="#5a7a9a" opacity="0.12"/>
  <rect x="14" y="526" width="44" height="4" rx="2" fill="#5a7a9a" opacity="0.10"/>
  <rect x="130" y="600" width="50" height="4" rx="2" fill="#5a7a9a" opacity="0.15"/>
  <rect x="130" y="608" width="36" height="4" rx="2" fill="#5a7a9a" opacity="0.12"/>

  <!-- Particles/dots -->
  <circle cx="20" cy="60" r="3" fill="#3a6a9a" opacity="0.2"/>
  <circle cx="180" cy="140" r="2" fill="#3a6a9a" opacity="0.15"/>
  <circle cx="160" cy="470" r="3" fill="#3a6a9a" opacity="0.18"/>
  <circle cx="30" cy="590" r="2" fill="#3a6a9a" opacity="0.15"/>
  <circle cx="100" cy="670" r="4" fill="#3a6a9a" opacity="0.12"/>
  <circle cx="170" cy="700" r="2.5" fill="#3a6a9a" opacity="0.1"/>
</svg>
