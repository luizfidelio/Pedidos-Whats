<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgEmobEsc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a8bccf"/>
      <stop offset="50%"  stop-color="#90a8bc"/>
      <stop offset="100%" stop-color="#a0b4c8"/>
    </linearGradient>
    <linearGradient id="monitorEmobEsc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2c3e55"/>
      <stop offset="100%" stop-color="#1a2636"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgEmobEsc)"/>
  <!-- Dark overlay -->
  <rect width="400" height="200" fill="#1a2a3a" opacity="0.45"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#3a5a7a" stroke-width="0.5">
    <line x1="0"   y1="50"  x2="400" y2="50"/>
    <line x1="0"   y1="100" x2="400" y2="100"/>
    <line x1="0"   y1="150" x2="400" y2="150"/>
    <line x1="80"  y1="0"   x2="80"  y2="200"/>
    <line x1="160" y1="0"   x2="160" y2="200"/>
    <line x1="240" y1="0"   x2="240" y2="200"/>
    <line x1="320" y1="0"   x2="320" y2="200"/>
  </g>

  <!-- Monitor body -->
  <rect x="80" y="30" width="200" height="130" rx="6" fill="#2c3e55" opacity="0.9"/>
  <!-- Toolbar -->
  <rect x="80" y="30" width="200" height="24" rx="6" fill="#3d5268" opacity="0.95"/>
  <rect x="80" y="46" width="200" height="8"  fill="#3d5268" opacity="0.95"/>
  <!-- Traffic lights -->
  <circle cx="94"  cy="42" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="108" cy="42" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="122" cy="42" r="5" fill="#22c55e" opacity="0.8"/>
  <!-- URL bar -->
  <rect x="136" y="36" width="100" height="12" rx="6" fill="#253444" opacity="0.95"/>

  <!-- Web content -->
  <rect x="84"  y="56"  width="192" height="16" fill="#3d5a7a" opacity="0.8"/>
  <rect x="84"  y="74"  width="192" height="40" fill="#2a3f55" opacity="0.7"/>
  <rect x="130" y="82"  width="100" height="8"  rx="2" fill="#9ac0d8" opacity="0.6"/>
  <rect x="148" y="94"  width="64"  height="5"  rx="2" fill="#7aaac8" opacity="0.5"/>
  <rect x="160" y="103" width="40"  height="8"  rx="4" fill="#6aaa8a" opacity="0.7"/>

  <!-- Cards row -->
  <rect x="84"  y="117" width="58" height="34" rx="3" fill="#3a5068" opacity="0.7"/>
  <rect x="148" y="117" width="58" height="34" rx="3" fill="#3a5068" opacity="0.7"/>
  <rect x="212" y="117" width="64" height="34" rx="3" fill="#3a5068" opacity="0.7"/>

  <!-- Monitor stand -->
  <rect x="170" y="161" width="20" height="18" fill="#2a3f55" opacity="0.8"/>
  <rect x="152" y="178" width="56" height="7"  rx="3" fill="#3a5068" opacity="0.7"/>

  <!-- Code chars -->
  <text x="14"  y="60"  font-family="monospace" font-size="52" fill="#3a5a7a" opacity="0.10">&lt;</text>
  <text x="340" y="100" font-family="monospace" font-size="52" fill="#3a5a7a" opacity="0.10">&gt;</text>
  <text x="16"  y="170" font-family="monospace" font-size="40" fill="#3a5a7a" opacity="0.08">{</text>
  <text x="348" y="185" font-family="monospace" font-size="40" fill="#3a5a7a" opacity="0.08">}</text>
</svg>
