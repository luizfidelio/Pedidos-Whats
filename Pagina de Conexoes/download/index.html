<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads — Net e Cia</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:      #AC3A40;
      --red-light:#d94e55;
      --red-dark: #7c2429;
      --dark:     #4C4D48;
      --bg:       #0f0f0e;
      --surface:  #1a1a18;
      --surface2: #242422;
      --text:     #f0ede8;
      --muted:    #9a9890;
      --white:    #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Particles canvas ── */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Grid overlay ── */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(172,58,64,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(172,58,64,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid rgba(172,58,64,0.15);
      backdrop-filter: blur(8px);
      background: rgba(15,15,14,0.8);
    }

    .header-logo { display: flex; align-items: center; text-decoration: none; }
    .header-logo svg { height: 32px; width: auto; display: block; }

    .header-badge {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid rgba(172,58,64,0.35);
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
    }

    .nav-btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(172,58,64,0.1);
      border: 1px solid rgba(172,58,64,0.3);
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .nav-btn-back svg { width: 13px; height: 13px; }
    .nav-btn-back:hover {
      background: rgba(172,58,64,0.2);
      border-color: rgba(172,58,64,0.55);
      color: var(--red-light);
    }

    /* ── Hero intro ── */
    .hero {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 4rem 2rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .hero-tag {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--red-light);
    }
    .hero-divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--white);
    }
    .hero h1 span {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 440px;
      line-height: 1.7;
    }

    /* ── Category filter tabs ── */
    .filter-bar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0 2rem 2.5rem;
    }
    .filter-btn {
      padding: 0.35rem 1rem;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: 1px solid rgba(172,58,64,0.25);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--text); border-color: rgba(172,58,64,0.5); }
    .filter-btn.active {
      background: rgba(172,58,64,0.18);
      border-color: rgba(172,58,64,0.5);
      color: var(--red-light);
    }

    /* ── Downloads grid ── */
    .downloads-section {
      position: relative;
      z-index: 5;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 2rem 5rem;
    }

    .cat-label {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }
    .cat-label-text {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red-light);
      font-weight: 700;
      white-space: nowrap;
    }
    .cat-label-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(172,58,64,0.25), transparent);
    }

    .downloads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 3rem;
    }

    /* ── Download card ── */
    .dl-card {
      background: var(--surface);
      border: 1px solid rgba(172,58,64,0.18);
      border-radius: 16px;
      padding: 1.4rem 1.4rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
      cursor: pointer;
    }
    .dl-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top left, rgba(172,58,64,0.06) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: inherit;
    }
    .dl-card:hover {
      border-color: rgba(172,58,64,0.45);
      box-shadow: 0 0 0 4px rgba(172,58,64,0.07), 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(-2px);
    }
    .dl-card:hover::before { opacity: 1; }

    /* Pulse dot (like conn-btn) */
    .dl-pulse {
      position: absolute;
      top: 14px; right: 14px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.65); }
    }

    .dl-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: rgba(172,58,64,0.1);
      border: 1px solid rgba(172,58,64,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }
    .dl-card:hover .dl-icon {
      background: rgba(172,58,64,0.18);
      border-color: rgba(172,58,64,0.38);
    }
    .dl-icon svg { width: 24px; height: 24px; color: var(--red-light); }

    .dl-info { flex: 1; }
    .dl-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }
    .dl-desc {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .dl-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
      padding-top: 0.9rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .dl-cat-tag {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(172,58,64,0.15);
      border: 1px solid rgba(172,58,64,0.3);
      color: var(--red-light);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .dl-btn svg { width: 13px; height: 13px; }
    .dl-card:hover .dl-btn {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      box-shadow: 0 4px 16px rgba(172,58,64,0.4);
    }

    /* ── Empty / loading ── */
    .state-box {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    .state-box svg {
      width: 52px; height: 52px;
      opacity: 0.2;
      margin-bottom: 1rem;
    }
    .state-box p { font-size: 1rem; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Stats bar ── */
    .stats {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 5rem;
      padding: 2.5rem 2rem;
      border-top: 1px solid rgba(172,58,64,0.1);
      border-bottom: 1px solid rgba(172,58,64,0.1);
    }
    .stat { text-align: center; }
    .stat-num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--red-light);
      display: block;
    }
    .stat-label {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 2.5rem;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }
    footer strong { color: var(--red-light); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--dark); border-radius: 3px; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header { padding: 1rem 1.25rem; }
      .header-badge { display: none; }
      .hero { padding: 2.5rem 1.25rem 2rem; }
      .downloads-section { padding: 0 1.25rem 4rem; }
      .downloads-grid { grid-template-columns: 1fr; }
      .stats { gap: 2.5rem; flex-wrap: wrap; }
    }
  </style>
</head>

  <!-- ── Particles JS (identical to hub) ── -->
  <script>
    (() => {
      const canvas = document.getElementById('particles');
      const ctx    = canvas.getContext('2d');
      let pts      = [];

      const resize = () => {
        canvas.width  = innerWidth;
        canvas.height = innerHeight;
        initPts();
      };

      const initPts = () => {
        pts = Array.from({ length: 55 }, () => ({
          x:  Math.random() * canvas.width,
          y:  Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.28,
          vy: (Math.random() - 0.5) * 0.28,
          r:  Math.random() * 1.5 + 0.4,
        }));
      };

      const draw = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pts.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width)  p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height)  p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(172,58,64,0.4)';
          ctx.fill();
        });
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const dx = pts[i].x - pts[j].x;
            const dy = pts[i].y - pts[j].y;
            const d  = Math.sqrt(dx * dx + dy * dy);
            if (d < 130) {
              ctx.beginPath();
              ctx.moveTo(pts[i].x, pts[i].y);
              ctx.lineTo(pts[j].x, pts[j].y);
              ctx.strokeStyle = `rgba(172,58,64,${0.07 * (1 - d / 130)})`;
              ctx.lineWidth   = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      };

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>

  <!-- ── Downloads loader ── -->
  <script>
    let allDownloads = [];
    let activeFilter = 'all';

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    const downloadIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

    function buildFilters(cats) {
      const bar = document.getElementById('filterBar');
      bar.innerHTML = '<button class="filter-btn active" data-cat="all">Todos</button>';
      cats.forEach(c => {
        const btn = document.createElement('button');
        btn.className  = 'filter-btn';
        btn.dataset.cat = c;
        btn.textContent = c;
        bar.appendChild(btn);
      });
      bar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = btn.dataset.cat;
          render();
        });
      });
    }

    function render() {
      const filtered = activeFilter === 'all'
        ? allDownloads
        : allDownloads.filter(d => d.category === activeFilter);

      const content = document.getElementById('content');

      if (!filtered.length) {
        content.innerHTML = `<div class="state-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M9.5 14s1 2 2.5 2 2.5-2 2.5-2"/></svg>
          <p>Nenhum arquivo encontrado.</p>
        </div>`;
        return;
      }

      // Agrupa por categoria na visão "Todos"
      if (activeFilter === 'all') {
        const cats = {};
        filtered.forEach(d => { const c = d.category || 'Geral'; (cats[c] = cats[c] || []).push(d); });
        content.innerHTML = Object.entries(cats).map(([cat, items]) => `
          <div class="cat-label">
            <span class="cat-label-text">${esc(cat)}</span>
            <span class="cat-label-line"></span>
          </div>
          <div class="downloads-grid">${items.map(cardHTML).join('')}</div>
        `).join('');
      } else {
        content.innerHTML = `<div class="downloads-grid">${filtered.map(cardHTML).join('')}</div>`;
      }
    }

    function cardHTML(d) {
      // Sempre usa o serve.php — nunca expõe caminho real do arquivo
      const href = `../api/serve.php?id=${d.id}`;
      return `
        <a class="dl-card" href="${esc(href)}" target="_blank" rel="noopener">
          <div class="dl-pulse"></div>
          <div class="dl-icon">${downloadIcon}</div>
          <div class="dl-info">
            <div class="dl-title">${esc(d.title)}</div>
            ${d.description ? `<div class="dl-desc">${esc(d.description)}</div>` : ''}
          </div>
          <div class="dl-footer">
            <span class="dl-cat-tag">${esc(d.category || 'Geral')}</span>
            <span class="dl-btn">
              ${downloadIcon}
              Baixar
            </span>
          </div>
        </a>`;
    }

    async function loadDownloads() {
      try {
        const res  = await fetch('../api/downloads.php');
        const json = await res.json();
        allDownloads = json.data || [];

        if (!allDownloads.length) {
          document.getElementById('content').innerHTML = `<div class="state-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <p>Nenhum download disponível no momento.</p>
          </div>`;
          return;
        }

        // Stats
        const cats = [...new Set(allDownloads.map(d => d.category || 'Geral'))];
        document.getElementById('statTotal').textContent = allDownloads.length;
        document.getElementById('statCats').textContent  = cats.length;
        document.getElementById('statsBar').style.display = '';

        buildFilters(cats);
        render();

      } catch {
        document.getElementById('content').innerHTML = `<div class="state-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p>Erro ao carregar downloads. Tente novamente.</p>
        </div>`;
      }
    }

    loadDownloads();
  </script>
