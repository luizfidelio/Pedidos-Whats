<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Central ADM — Central de Conexões</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg2: #111114;
    --surface: #18181c;
    --surface2: #1e1e24;
    --surface3: #22222a;
    --border: rgba(255,255,255,0.07);
    --red: #AC3A40;
    --red-light: #d94f56;
    --red-dark: #8a2d32;
    --text: #e8e8ec;
    --text-muted: #8a8a96;
    --sidebar-w: 220px;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  .layout { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 0 0 16px;
    overflow-y: auto; z-index: 100;
  }
  .sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .sidebar-logo svg { width: 32px; height: 32px; flex-shrink: 0; }
  .sidebar-logo-text { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .sidebar-logo-text span { display: block; font-weight: 400; color: var(--text-muted); font-size: 11px; }
  .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px;
    color: var(--text-muted); text-decoration: none;
    font-size: 13px; font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .nav-item.active { background: rgba(172,58,64,0.18); color: var(--red-light); }
  .nav-item--admin { display: none; }
  .btn-logout {
    margin: 0 10px; padding: 9px 12px;
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-muted); font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    width: calc(100% - 20px);
  }
  .btn-logout svg { width: 16px; height: 16px; }
  .btn-logout:hover { background: rgba(172,58,64,0.12); border-color: var(--red-dark); color: var(--red-light); }

  /* ── Main ── */
  .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .page-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,10,12,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .page-title { font-size: 18px; font-weight: 700; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-info span { font-size: 13px; color: var(--text-muted); }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .badge--admin { background: rgba(172,58,64,0.22); color: var(--red-light); border: 1px solid rgba(172,58,64,0.35); }
  .badge--editor { background: rgba(255,255,255,0.07); color: var(--text-muted); border: 1px solid var(--border); }

  .page-body { padding: 28px; flex: 1; }
  .page-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 15px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; border: none;
    transition: opacity 0.15s, transform 0.15s, background 0.15s;
    text-decoration: none; white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-light); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,0.07); }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid transparent; padding: 6px 10px; }
  .btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); border-color: var(--border); }
  .btn-danger { background: rgba(172,58,64,0.15); color: var(--red-light); border: 1px solid rgba(172,58,64,0.25); }
  .btn-danger:hover { background: rgba(172,58,64,0.28); }
  .btn-icon { padding: 6px; border-radius: 6px; }
  .btn-icon svg { width: 14px; height: 14px; }
  .btn-add-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
    background: none; border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 6px; padding: 5px 10px;
    cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .btn-add-link:hover { color: var(--red-light); border-color: rgba(172,58,64,0.4); }
  .btn-add-link svg { width: 12px; height: 12px; }

  /* ── Columns List ── */
  .columns-list { display: flex; flex-direction: column; gap: 14px; }

  /* ── Column Card ── */
  .column-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .column-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    background: var(--surface);
    border-bottom: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .column-header:hover { background: var(--surface2); }
  .column-header.open { border-bottom-color: var(--border); }
  .column-chevron { color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
  .column-chevron svg { width: 16px; height: 16px; display: block; }
  .column-header.open .column-chevron { transform: rotate(180deg); }
  .column-info { flex: 1; min-width: 0; }
  .column-name { font-weight: 700; font-size: 14px; color: var(--text); }
  .column-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .column-meta { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .inactive-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: rgba(255,255,255,0.06); color: var(--text-muted); border: 1px solid var(--border); font-weight: 700; }

  /* ── Column Body ── */
  .column-body { display: none; padding: 14px 18px; }
  .column-body.open { display: block; }

  /* ── Cards in column ── */
  .cards-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .card-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .card-header:hover { background: rgba(255,255,255,0.03); }
  .card-favicon {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden; font-size: 9px; font-weight: 700; color: #fff;
  }
  .card-favicon img { width: 100%; height: 100%; object-fit: contain; }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-weight: 600; font-size: 13px; }
  .card-tag { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .card-chevron { color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
  .card-chevron svg { width: 14px; height: 14px; display: block; }
  .card-header.open .card-chevron { transform: rotate(180deg); }
  .card-actions { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
  .card-body { display: none; padding: 8px 14px 12px 50px; }
  .card-body.open { display: block; }

  /* ── Links in card ── */
  .links-list { list-style: none; margin-bottom: 8px; }
  .link-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .link-item:last-child { border-bottom: none; }
  .link-bullet { width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .link-label { flex: 1; font-size: 12px; color: var(--text); }
  .link-url { font-size: 11px; color: var(--text-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-actions { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }

  /* ── Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    z-index: 500; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: none; } }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; display: flex; align-items: center; transition: color 0.15s, background 0.15s; }
  .modal-close:hover { color: var(--text); background: rgba(255,255,255,0.07); }
  .modal-close svg { width: 18px; height: 18px; }
  .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .modal-footer { padding: 16px 24px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  input[type="text"], input[type="url"], input[type="number"] {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13px; padding: 9px 12px;
    outline: none; width: 100%; transition: border-color 0.15s; font-family: inherit;
  }
  input[type="text"]:focus, input[type="url"]:focus, input[type="number"]:focus { border-color: var(--red); }
  .checkbox-row { display: flex; align-items: center; gap: 10px; }
  .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--red); cursor: pointer; }
  .checkbox-row label { margin: 0; font-size: 13px; text-transform: none; letter-spacing: normal; color: var(--text); font-weight: 500; cursor: pointer; }
  .input-hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ── Confirm ── */
  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 600; align-items: center; justify-content: center; padding: 20px; }
  .confirm-overlay.open { display: flex; }
  .confirm-dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; max-width: 380px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.6); animation: modalIn 0.2s ease; }
  .confirm-dialog h3 { font-size: 16px; margin-bottom: 10px; }
  .confirm-dialog p { color: var(--text-muted); font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* ── Toast ── */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; font-size: 13px; color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,0.5); animation: slideIn 0.25s ease; max-width: 320px; }
  .toast--success { border-left: 3px solid #3ecf8e; }
  .toast--error { border-left: 3px solid var(--red-light); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideOut { from { opacity: 1; } to { opacity: 0; transform: translateX(30px); } }
  .toast.hiding { animation: slideOut 0.2s ease forwards; }

  /* ── Empty ── */
  .empty-columns { padding: 60px 20px; text-align: center; color: var(--text-muted); }
  .empty-columns svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 12px; }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .sidebar { position: fixed; left: -220px; top: 0; bottom: 0; transition: left 0.25s; }
    .sidebar.open { left: 0; }
    .page-body { padding: 16px; }
    .page-header { padding: 12px 16px; }
    .form-row { grid-template-columns: 1fr; }
    .hamburger { display: flex !important; }
    .card-body { padding-left: 14px; }
  }
  .hamburger { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="41 44 340 346" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M365.47 86.6633L365.33 85.5588L365.197 84.8125L364.983 83.7866L364.688 82.6558L364.354 81.574L363.695 79.8727C362.459 77.053 360.781 74.4627 358.601 72.2775C356.468 70.1482 353.966 68.3818 351.171 67.2453L350.026 66.7854L348.953 66.4066L348.033 66.1327L346.775 65.8201L345.358 65.5542L343.563 65.3488L342.289 65.2803L341.671 65.2723H283.25C270.108 65.2723 259.334 76.0489 259.334 89.2011C259.334 98.7818 265.128 107.434 273.89 111.203L282.263 114.806L192.193 204.907C182.905 214.207 182.905 229.449 192.193 238.745C201.49 248.042 216.731 248.042 226.019 238.745L316.089 148.641L319.69 157.022C323.454 165.785 332.107 171.587 341.688 171.587C354.829 171.587 365.604 160.805 365.604 147.657V89.2011C365.604 88.3636 365.573 87.9471 365.548 87.5226 365.501 87.0924 365.47 86.6633Z" fill="#AC3A40"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M376.531 201.508L328.73 204.857C337.224 264.914 299.08 322.344 240.558 338.032C176.632 355.168 110.077 316.727 92.9483 252.78C75.8192 188.833 114.245 122.248 178.168 105.113C193.696 100.952 210.014 99.9126 225.943 102.119L229.205 54.2824C207.959 51.7537 186.452 53.3467 165.789 58.8902C122.516 70.4883 86.012 98.6117 63.6245 137.407C41.262 176.157 35.1595 221.924 46.7428 265.167C58.3364 308.453 86.4489 344.971 125.229 367.367C163.964 389.739 209.71 395.844 252.939 384.256C333.347 362.702 386.549 284.224 376.53 201.508H376.531Z" fill="#AC3A40"/>
      </svg>
      <div class="sidebar-logo-text">Netecia<span>Central de Conexões</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="nodes.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9" stroke-dasharray="4 2"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/></svg>
        Nós da Órbita
      </a>
      <a href="columns.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Central ADM
      </a>
      <a href="users.html" class="nav-item nav-item--admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

      </a>

    <button class="btn-logout" id="btnLogout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="page-title">Central ADM — Colunas</h1>
      </div>
      <div class="user-info">
        <span id="userName"></span>
        <span class="badge" id="userBadge"></span>
      </div>
    </header>

    <div class="page-body">
      <div class="page-toolbar">
        <p style="color:var(--text-muted);font-size:13px;">Organize colunas, cards e links do painel Central ADM.</p>
        <button class="btn btn-primary" id="btnNewColumn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova Coluna
        </button>
      </div>
      <div class="columns-list" id="columnsList">
        <div style="padding:40px;text-align:center;color:var(--text-muted);">Carregando...</div>
      </div>
    </div>
  </main>
</div>

<!-- ── Modal: Column ── -->
<div class="modal-overlay" id="colModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="colModalTitle">Nova Coluna</h2>
      <button class="modal-close" onclick="closeModal('colModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="colId" />
      <div class="form-group">
        <label for="colTitle">Título *</label>
        <input type="text" id="colTitle" placeholder="Ex: Gestão de Sistemas" required />
      </div>
      <div class="form-group">
        <label for="colSubtitle">Subtítulo</label>
        <input type="text" id="colSubtitle" placeholder="Ex: Área Administrativa" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="colOrder">Ordem</label>
          <input type="number" id="colOrder" value="0" min="0" />
        </div>
        <div class="form-group" style="justify-content:flex-end;padding-top:20px;">
          <div class="checkbox-row">
            <input type="checkbox" id="colActive" checked />
            <label for="colActive">Ativo</label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('colModal')">Cancelar</button>
      <button class="btn btn-primary" id="colSaveBtn" onclick="saveColumn()">Salvar</button>
    </div>
  </div>
</div>

<!-- ── Modal: Card ── -->
<div class="modal-overlay" id="cardModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="cardModalTitle">Novo Card</h2>
      <button class="modal-close" onclick="closeModal('cardModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="cardId" />
      <input type="hidden" id="cardColumnId" />
      <div class="form-row">
        <div class="form-group">
          <label for="cardName">Nome *</label>
          <input type="text" id="cardName" placeholder="Ex: SGBR" required />
        </div>
        <div class="form-group">
          <label for="cardTag">Tag</label>
          <input type="text" id="cardTag" placeholder="Ex: Sistemas" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="cardDomain">Domínio Favicon</label>
          <input type="text" id="cardDomain" placeholder="Ex: sgbr.com.br" />
          <span class="input-hint">Apenas o domínio (sem https://)</span>
        </div>
        <div class="form-group">
          <label for="cardInitials">Iniciais Fallback</label>
          <input type="text" id="cardInitials" placeholder="Ex: SG" maxlength="4" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="cardOrder">Ordem</label>
          <input type="number" id="cardOrder" value="0" min="0" />
        </div>
        <div class="form-group" style="justify-content:flex-end;padding-top:20px;">
          <div class="checkbox-row">
            <input type="checkbox" id="cardActive" checked />
            <label for="cardActive">Ativo</label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('cardModal')">Cancelar</button>
      <button class="btn btn-primary" id="cardSaveBtn" onclick="saveCard()">Salvar</button>
    </div>
  </div>
</div>

<!-- ── Modal: Link ── -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="linkModalTitle">Novo Link</h2>
      <button class="modal-close" onclick="closeModal('linkModal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="linkId" />
      <input type="hidden" id="linkCardId" />
      <div class="form-group">
        <label for="linkLabel">Label *</label>
        <input type="text" id="linkLabel" placeholder="Ex: Acesso Restrito — Login" required />
      </div>
      <div class="form-group">
        <label for="linkUrl">URL *</label>
        <input type="text" id="linkUrl" placeholder="https://..." required />
      </div>
      <div class="form-group">
        <label for="linkOrder">Ordem</label>
        <input type="number" id="linkOrder" value="0" min="0" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('linkModal')">Cancelar</button>
      <button class="btn btn-primary" id="linkSaveBtn" onclick="saveLink()">Salvar</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <h3>Confirmar exclusão</h3>
    <p id="confirmMsg">Tem certeza que deseja excluir?</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancel">Cancelar</button>
      <button class="btn btn-danger" id="confirmOk">Excluir</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const API = '../api';
let currentUser = null;
let confirmCallback = null;
let allColumns = [];

// ── Auth ──────────────────────────────────────────────────────────────────
async function checkAuth() {
  const token = localStorage.getItem('central_token');
  if (!token) { window.location.href = '../area-restrita.html'; return; }
  try {
    const res = await fetch(`${API}/auth.php`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!res.ok) throw new Error();
    const data = await res.json();
    currentUser = data.user;
    document.getElementById('userName').textContent = currentUser.name;
    const badge = document.getElementById('userBadge');
    badge.textContent = currentUser.role === 'admin' ? 'Admin' : 'Editor';
    badge.className = 'badge badge--' + currentUser.role;
    if (currentUser.role === 'admin') document.querySelectorAll('.nav-item--admin').forEach(el => el.style.display = 'flex');
    loadColumns();
  } catch {
    localStorage.removeItem('central_token');
    window.location.href = '../area-restrita.html';
  }
}

function authHeaders() {
  return { 'Authorization': `Bearer ${localStorage.getItem('central_token')}`, 'Content-Type': 'application/json' };
}

// ── Load ──────────────────────────────────────────────────────────────────
async function loadColumns() {
  try {
    const res = await fetch(`${API}/columns.php?all=1`, { headers: authHeaders() });
    allColumns = await res.json();
    renderColumns();
  } catch {
    showToast('Erro ao carregar colunas', 'error');
  }
}

function renderColumns() {
  const list = document.getElementById('columnsList');
  if (!allColumns.length) {
    list.innerHTML = `<div class="empty-columns">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      <p>Nenhuma coluna cadastrada ainda.</p>
    </div>`;
    return;
  }
  list.innerHTML = allColumns.map(col => renderColumnHtml(col)).join('');
}

function renderColumnHtml(col) {
  const cards = col.cards || [];
  const statusBadge = !col.active ? '<span class="inactive-badge">INATIVO</span>' : '';
  return `
  <div class="column-card" id="col-${col.id}">
    <div class="column-header open" onclick="toggleSection(this)">
      <span class="column-chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
      <div class="column-info">
        <div class="column-name">${escHtml(col.title)}</div>
        ${col.subtitle ? `<div class="column-subtitle">${escHtml(col.subtitle)}</div>` : ''}
      </div>
      <div class="column-meta">
        ${statusBadge}
        <button class="btn btn-ghost btn-icon" title="Editar coluna" onclick="event.stopPropagation(); openEditColumn(${JSON.stringify(col).replace(/"/g, '&quot;')})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn btn-danger btn-icon" title="Excluir coluna" onclick="event.stopPropagation(); confirmDelete('Excluir coluna &quot;${escHtml(col.title)}&quot;? Todos os cards e links serão excluídos.', () => deleteItem('column', ${col.id}, null))">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>
    </div>
    <div class="column-body open">
      <div class="cards-list" id="cards-${col.id}">
        ${cards.map(card => renderCardHtml(card)).join('')}
      </div>
      <button class="btn-add-link" onclick="openNewCard(${col.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar Card
      </button>
    </div>
  </div>`;
}

function renderCardHtml(card) {
  const links = card.links || [];
  const faviconHtml = card.favicon_domain
    ? `<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(card.favicon_domain)}&sz=32" alt="" onerror="this.parentElement.innerHTML='${escHtml(card.fallback_initials || '?')}'" />`
    : escHtml(card.fallback_initials || '?');
  const statusBadge = !card.active ? '<span class="inactive-badge" style="font-size:10px;">OFF</span>' : '';
  return `
  <div class="card-item" id="card-${card.id}">
    <div class="card-header open" onclick="toggleSection(this)">
      <div class="card-chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-favicon">${faviconHtml}</div>
      <div class="card-info">
        <div class="card-name">${escHtml(card.name)}</div>
        ${card.tag ? `<div class="card-tag">${escHtml(card.tag)}</div>` : ''}
      </div>
      <div class="card-actions">
        ${statusBadge}
        <button class="btn btn-ghost btn-icon" title="Editar card" onclick="event.stopPropagation(); openEditCard(${JSON.stringify(card).replace(/"/g, '&quot;')})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn btn-danger btn-icon" title="Excluir card" onclick="event.stopPropagation(); confirmDelete('Excluir card &quot;${escHtml(card.name)}&quot;? Todos os links serão excluídos.', () => deleteItem('card', ${card.id}, ${card.column_id}))">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>
    </div>
    <div class="card-body open">
      <ul class="links-list" id="links-${card.id}">
        ${links.map(link => renderLinkHtml(link, card.id)).join('')}
      </ul>
      <button class="btn-add-link" onclick="openNewLink(${card.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar Link
      </button>
    </div>
  </div>`;
}

function renderLinkHtml(link, cardId) {
  return `
  <li class="link-item" id="link-${link.id}">
    <span class="link-bullet"></span>
    <span class="link-label">${escHtml(link.label)}</span>
    <span class="link-url">${escHtml(link.url)}</span>
    <div class="link-actions">
      <button class="btn btn-ghost btn-icon" title="Editar link" onclick="openEditLink(${JSON.stringify(link).replace(/"/g, '&quot;')}, ${cardId})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="btn btn-danger btn-icon" title="Excluir link" onclick="confirmDelete('Excluir link &quot;${escHtml(link.label)}&quot;?', () => deleteItem('link', ${link.id}, null))">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    </div>
  </li>`;
}

// ── Accordion ─────────────────────────────────────────────────────────────
function toggleSection(header) {
  header.classList.toggle('open');
  const body = header.nextElementSibling;
  if (body) body.classList.toggle('open');
}

// ── Column CRUD ───────────────────────────────────────────────────────────
function openNewColumn() {
  document.getElementById('colModalTitle').textContent = 'Nova Coluna';
  document.getElementById('colId').value = '';
  document.getElementById('colTitle').value = '';
  document.getElementById('colSubtitle').value = '';
  document.getElementById('colOrder').value = '0';
  document.getElementById('colActive').checked = true;
  openModal('colModal');
}

function openEditColumn(col) {
  document.getElementById('colModalTitle').textContent = 'Editar Coluna';
  document.getElementById('colId').value = col.id;
  document.getElementById('colTitle').value = col.title || '';
  document.getElementById('colSubtitle').value = col.subtitle || '';
  document.getElementById('colOrder').value = col.sort_order || 0;
  document.getElementById('colActive').checked = !!parseInt(col.active);
  openModal('colModal');
}

async function saveColumn() {
  const title = document.getElementById('colTitle').value.trim();
  if (!title) { showToast('Título é obrigatório', 'error'); return; }
  const id = document.getElementById('colId').value;
  const body = {
    title,
    subtitle: document.getElementById('colSubtitle').value.trim(),
    sort_order: parseInt(document.getElementById('colOrder').value) || 0,
    active: document.getElementById('colActive').checked ? 1 : 0,
  };
  const btn = document.getElementById('colSaveBtn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    let res;
    if (id) {
      res = await fetch(`${API}/columns.php?type=column&id=${id}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
    } else {
      res = await fetch(`${API}/columns.php?type=column`, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro');
    showToast(id ? 'Coluna atualizada!' : 'Coluna criada!');
    closeModal('colModal');
    loadColumns();
  } catch (e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Salvar'; }
}

// ── Card CRUD ─────────────────────────────────────────────────────────────
function openNewCard(columnId) {
  document.getElementById('cardModalTitle').textContent = 'Novo Card';
  document.getElementById('cardId').value = '';
  document.getElementById('cardColumnId').value = columnId;
  document.getElementById('cardName').value = '';
  document.getElementById('cardTag').value = '';
  document.getElementById('cardDomain').value = '';
  document.getElementById('cardInitials').value = '';
  document.getElementById('cardOrder').value = '0';
  document.getElementById('cardActive').checked = true;
  openModal('cardModal');
}

function openEditCard(card) {
  document.getElementById('cardModalTitle').textContent = 'Editar Card';
  document.getElementById('cardId').value = card.id;
  document.getElementById('cardColumnId').value = card.column_id;
  document.getElementById('cardName').value = card.name || '';
  document.getElementById('cardTag').value = card.tag || '';
  document.getElementById('cardDomain').value = card.favicon_domain || '';
  document.getElementById('cardInitials').value = card.fallback_initials || '';
  document.getElementById('cardOrder').value = card.sort_order || 0;
  document.getElementById('cardActive').checked = !!parseInt(card.active);
  openModal('cardModal');
}

async function saveCard() {
  const name = document.getElementById('cardName').value.trim();
  const columnId = document.getElementById('cardColumnId').value;
  if (!name) { showToast('Nome é obrigatório', 'error'); return; }
  const id = document.getElementById('cardId').value;
  const body = {
    column_id: parseInt(columnId),
    name,
    tag: document.getElementById('cardTag').value.trim(),
    favicon_domain: document.getElementById('cardDomain').value.trim(),
    fallback_initials: document.getElementById('cardInitials').value.trim(),
    sort_order: parseInt(document.getElementById('cardOrder').value) || 0,
    active: document.getElementById('cardActive').checked ? 1 : 0,
  };
  const btn = document.getElementById('cardSaveBtn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    let res;
    if (id) {
      res = await fetch(`${API}/columns.php?type=card&id=${id}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
    } else {
      res = await fetch(`${API}/columns.php?type=card`, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro');
    showToast(id ? 'Card atualizado!' : 'Card criado!');
    closeModal('cardModal');
    loadColumns();
  } catch (e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Salvar'; }
}

// ── Link CRUD ─────────────────────────────────────────────────────────────
function openNewLink(cardId) {
  document.getElementById('linkModalTitle').textContent = 'Novo Link';
  document.getElementById('linkId').value = '';
  document.getElementById('linkCardId').value = cardId;
  document.getElementById('linkLabel').value = '';
  document.getElementById('linkUrl').value = '';
  document.getElementById('linkOrder').value = '0';
  openModal('linkModal');
}

function openEditLink(link, cardId) {
  document.getElementById('linkModalTitle').textContent = 'Editar Link';
  document.getElementById('linkId').value = link.id;
  document.getElementById('linkCardId').value = link.card_id || cardId;
  document.getElementById('linkLabel').value = link.label || '';
  document.getElementById('linkUrl').value = link.url || '';
  document.getElementById('linkOrder').value = link.sort_order || 0;
  openModal('linkModal');
}

async function saveLink() {
  const label = document.getElementById('linkLabel').value.trim();
  const url = document.getElementById('linkUrl').value.trim();
  const cardId = document.getElementById('linkCardId').value;
  if (!label || !url) { showToast('Label e URL são obrigatórios', 'error'); return; }
  const id = document.getElementById('linkId').value;
  const body = {
    card_id: parseInt(cardId),
    label,
    url,
    sort_order: parseInt(document.getElementById('linkOrder').value) || 0,
  };
  const btn = document.getElementById('linkSaveBtn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    let res;
    if (id) {
      res = await fetch(`${API}/columns.php?type=link&id=${id}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
    } else {
      res = await fetch(`${API}/columns.php?type=link`, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro');
    showToast(id ? 'Link atualizado!' : 'Link criado!');
    closeModal('linkModal');
    loadColumns();
  } catch (e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Salvar'; }
}

// ── Delete ────────────────────────────────────────────────────────────────
async function deleteItem(type, id, _columnId) {
  try {
    const res = await fetch(`${API}/columns.php?type=${type}&id=${id}`, { method: 'DELETE', headers: authHeaders() });
    if (!res.ok) throw new Error();
    showToast('Excluído com sucesso!');
    loadColumns();
  } catch {
    showToast('Erro ao excluir', 'error');
  }
}

function confirmDelete(msg, cb) {
  document.getElementById('confirmMsg').innerHTML = msg;
  confirmCallback = cb;
  document.getElementById('confirmOverlay').classList.add('open');
}

// ── Modal helpers ─────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => { el.classList.add('hiding'); el.addEventListener('animationend', () => el.remove()); }, 3500);
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Events ────────────────────────────────────────────────────────────────
document.getElementById('btnNewColumn').addEventListener('click', openNewColumn);
document.getElementById('btnLogout').addEventListener('click', () => { localStorage.removeItem('central_token'); window.location.href = '../area-restrita.html'; });
document.getElementById('hamburger').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('confirmCancel').addEventListener('click', () => { confirmCallback = null; document.getElementById('confirmOverlay').classList.remove('open'); });
document.getElementById('confirmOk').addEventListener('click', () => { if (confirmCallback) confirmCallback(); confirmCallback = null; document.getElementById('confirmOverlay').classList.remove('open'); });
['colModal','cardModal','linkModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => { if (e.target === document.getElementById(id)) closeModal(id); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { ['colModal','cardModal','linkModal'].forEach(closeModal); document.getElementById('confirmOverlay').classList.remove('open'); }
});

checkAuth();
</script>
</body>
</html>
