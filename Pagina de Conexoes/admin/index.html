<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Central de Conexões</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg2: #111114;
    --surface: #18181c;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.07);
    --red: #AC3A40;
    --red-light: #d94f56;
    --red-dark: #8a2d32;
    --text: #e8e8ec;
    --text-muted: #8a8a96;
    --sidebar-w: 220px;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  /* ── Layout ── */
  .layout { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0 0 16px;
    overflow-y: auto;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .sidebar-logo:hover { opacity: 0.75; }
  .sidebar-logo svg { width: 32px; height: 32px; flex-shrink: 0; }
  .sidebar-logo-text { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .sidebar-logo-text span { display: block; font-weight: 400; color: var(--text-muted); font-size: 11px; }
  .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .nav-item.active { background: rgba(172,58,64,0.18); color: var(--red-light); }
  .nav-item--admin { display: none; }
  .btn-logout {
    margin: 0 10px;
    padding: 9px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    width: calc(100% - 20px);
  }
  .btn-logout svg { width: 16px; height: 16px; }
  .btn-logout:hover { background: rgba(172,58,64,0.12); border-color: var(--red-dark); color: var(--red-light); }

  /* ── Main ── */
  .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .page-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,10,12,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .page-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-info span { font-size: 13px; color: var(--text-muted); }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .badge--admin { background: rgba(172,58,64,0.22); color: var(--red-light); border: 1px solid rgba(172,58,64,0.35); }
  .badge--editor { background: rgba(255,255,255,0.07); color: var(--text-muted); border: 1px solid var(--border); }
  .badge--acesso { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }

  /* ── Page body ── */
  .page-body { padding: 28px; flex: 1; }

  /* ── Stat Cards ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat-card:hover { border-color: rgba(172,58,64,0.3); transform: translateY(-2px); }
  .stat-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: rgba(172,58,64,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .stat-icon svg { width: 22px; height: 22px; color: var(--red-light); }
  .stat-info { flex: 1; min-width: 0; }
  .stat-number { font-size: 32px; font-weight: 800; color: var(--text); line-height: 1; margin-bottom: 5px; }
  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

  /* ── Quick Actions ── */
  .section-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
  .actions-grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-light); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,0.07); }
  .btn svg { width: 16px; height: 16px; }

  /* ── Toast ── */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    animation: slideIn 0.25s ease;
    max-width: 320px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toast--success { border-left: 3px solid #3ecf8e; }
  .toast--error { border-left: 3px solid var(--red-light); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(30px); } }
  .toast.hiding { animation: slideOut 0.2s ease forwards; }

  /* ── Loading skeleton ── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
    height: 32px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .sidebar { position: fixed; left: -220px; top: 0; bottom: 0; transition: left 0.25s; }
    .sidebar.open { left: 0; }
    .main-content { margin-left: 0; }
    .page-body { padding: 16px; }
    .page-header { padding: 12px 16px; }
    .hamburger { display: flex !important; }
  }
  .hamburger { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; }
</style>
</head>
<body>

<!-- Toast container -->

<script>
const API = '../api';
let currentUser = null;

// ── Auth ──────────────────────────────────────────────────────────────────
async function checkAuth() {
  const token = localStorage.getItem('central_token');
  if (!token) { window.location.href = '../area-restrita.html'; return; }
  try {
    const res = await fetch(`${API}/auth.php`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    currentUser = data.user;
    // Usuário de acesso só vê centraladm.html
    if (currentUser.role === 'acesso') { window.location.href = '../centraladm.html'; return; }
    renderUser();
    if (currentUser.role === 'admin') {
      document.querySelectorAll('.nav-item--admin').forEach(el => el.style.display = 'flex');
    }
    loadStats();
  } catch {
    localStorage.removeItem('central_token');
    window.location.href = '../area-restrita.html';
  }
}

function renderUser() {
  document.getElementById('userName').textContent = currentUser.name;
  const badge = document.getElementById('userBadge');
  const roleLabel = { admin: 'Admin', editor: 'Editor', acesso: 'Acesso' };
  badge.textContent = roleLabel[currentUser.role] ?? currentUser.role;
  badge.className = 'badge badge--' + currentUser.role;
}

// ── Stats ─────────────────────────────────────────────────────────────────
async function loadStats() {
  const token = localStorage.getItem('central_token');
  const headers = { 'Authorization': `Bearer ${token}` };

  const [nodesRes, colsRes] = await Promise.all([
    fetch(`${API}/nodes.php?all=1`, { headers }),
    fetch(`${API}/columns.php?all=1`, { headers })
  ]);
  const nodes = await nodesRes.json();
  const cols = await colsRes.json();

  let totalCards = 0;
  cols.forEach(c => { totalCards += (c.cards || []).length; });

  const stats = [
    {
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9" stroke-dasharray="4 2"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/></svg>`,
      count: nodes.length, label: 'Nós da Órbita'
    },
    {
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>`,
      count: cols.length, label: 'Colunas'
    },
    {
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>`,
      count: totalCards, label: 'Cards Totais'
    },
  ];

  let usersCount = null;
  if (currentUser.role === 'admin') {
    try {
      const uRes = await fetch(`${API}/users.php`, { headers });
      const users = await uRes.json();
      usersCount = users.length;
    } catch {}
    stats.push({
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      count: usersCount ?? 0, label: 'Usuários'
    });
  }

  renderStats(stats);
}

function renderStats(stats) {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-icon">${s.icon}</div>
      <div class="stat-info">
        <div class="stat-number" data-target="${s.count}">0</div>
        <div class="stat-label">${s.label}</div>
      </div>
    </div>
  `).join('');
  // Count-up animation
  grid.querySelectorAll('.stat-number').forEach(el => {
    const target = parseInt(el.dataset.target, 10);
    let current = 0;
    const step = Math.max(1, Math.ceil(target / 30));
    const timer = setInterval(() => {
      current = Math.min(current + step, target);
      el.textContent = current;
      if (current >= target) clearInterval(timer);
    }, 30);
  });
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => {
    el.classList.add('hiding');
    el.addEventListener('animationend', () => el.remove());
  }, 3500);
}

// ── Logout ────────────────────────────────────────────────────────────────
document.getElementById('btnLogout').addEventListener('click', () => {
  localStorage.removeItem('central_token');
  window.location.href = '../area-restrita.html';
});

// ── Hamburger ─────────────────────────────────────────────────────────────
document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});
document.addEventListener('click', e => {
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('open') && !sb.contains(e.target) && e.target !== document.getElementById('hamburger')) {
    sb.classList.remove('open');
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
checkAuth();
</script>
